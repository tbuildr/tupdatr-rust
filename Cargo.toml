[package]
name = "tupdatr"
version = "0.1.0"
edition = "2021"
description = "Colourful animated terminal update menu, rewritten from C/ncurses to Rust/ratatui"

[[bin]]
name = "tu"
path = "src/main.rs"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
clap = "4"

[profile.release]
lto = true
strip = true
